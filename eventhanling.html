<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handling</title>
    <style>
        #div1{
            width: 100px;
            height: 100px;
            background-color: red;
        }
        .div2{
            width: 100px;
            height: 200px;
            background-color: red;
        
        }
        /* #heading2{
            background-color: blue;
        } */
    </style>
</head>
<body>
    <h1>event Handling</h1>

    <div id="div1"></div>

    <button class='btn1'>change size</button>
    <button class="btn1">change color</button>

    <p>hello world</p>
    <div></div>

    <h1 id="heading2">heding 2</h1>

    <script>
        document.getElementById("div1").addEventListener('click',()=>{
            document.getElementById("div1").style = 'background-color:yellow;width:200px'
            
        })
        document.getElementById("div1").addEventListener('dblclick',()=>{
            document.getElementById("div1").style.backgroundColor = 'blue'
        })
        document.getElementById("div1").addEventListener('mouseleave',()=>{
            document.getElementById("div1").style = 'background-color:red;width:100px'
        })
        document.getElementById("div1").addEventListener('mouseover',()=>{
            document.getElementById("div1").style.backgroundColor = 'black'
        })

        document.getElementsByClassName('btn1')[1].addEventListener('click',()=>{
            document.getElementById("div1").style.backgroundColor = 'pink'
        })
        document.getElementsByClassName('btn1')[0].addEventListener("click",()=>{
            document.getElementById("div1").style = 'background-color:yellow;width:500px;height:400px'
        })
        document.getElementsByTagName('p')[0].addEventListener('click',()=>{
            document.getElementsByTagName('div')[0].classList.toggle('div2')
        })
        document.getElementsByTagName('h1')[1].addEventListener('click',()=>{
           document.getElementsByTagName('h1')[1].style='background-color:red' 
        })
    </script>
</body>
</html>
