<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #d1{
            background-color: blueviolet;
            height: 50px;
            width: 50px;
        }
        #div5{
            height: 100px;
            width: 100px;
            background-color: yellow;
            position: absolute;
        }

    </style>
</head>
<body id="body1">
    <button id="btn1">click</button>
    <div id="d1"></div><br><br>


        <label for="">color:</label><input type="text" id="a1"><br>
        <label for="">width:</label><input type="number" id="a2"><br>
        <label for="">height:</label><input type="number" id="a3"><br>
        <label for="">border radius:</label><input type="number" id="a4"><br>

        <div id="div4"></div>

        <div id="div5"></div>

    <script>
        let move = 0;
        let top1 = 0;
        
            document.getElementById('d1').addEventListener('click',()=>{
            document.getElementById("d1").style='width:100px;height:100px;';
            }
        )
        document.getElementById("a1").addEventListener('input',()=>{
            let color = document.getElementById("a1").value
            document.getElementById("div5").style.backgroundColor= color
        })
        document.getElementById('a2').addEventListener("input",()=>{
            let ran = document.getElementById('a2').value
            document.getElementById("div5").style.width=`${ran}px`
        })
        document.getElementById('a3').addEventListener("input",()=>{
            let ran = document.getElementById('a3').value
            document.getElementById("div5").style.height=`${ran}px`;
        })
        document.getElementById('a4').addEventListener("input",()=>{
            let ran = document.getElementById('a4').value
            document.getElementById("div5").style.borderRadius=`${ran}px`
        })
        document.getElementById('btn1').addEventListener('click',()=>{
            alert("button clicked")
        })
        document.getElementById('body1').addEventListener('keydown',(e)=>{
            console.log(e.key)
            if (e.key == 'k'){
                document.getElementById('div4').style = "height:200px;width:200px;background-color:black;"
            }
            else if(e.key == 'f'){
                document.getElementById('div4').style =""
            }
            else if(e.key == 'ArrowRight'){
                move +=10
                document.getElementById('div5').style.marginLeft = `${move}px`
            }
            else if(e.key == 'ArrowLeft'){
                move -=10
                document.getElementById('div5').style.marginLeft = `${move}px`
            }
            else if(e.key == 'ArrowUp'){
                top1 -=10
                document.getElementById('div5').style.marginTop = `${top1}px`
            }
             else if(e.key == 'ArrowDown'){
                top1 +=10
                document.getElementById('div5').style.marginTop = `${top1}px`
            }
        })


    </script>
</body>
</html>
