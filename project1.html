<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input {
            width: 300px;
            height: 32px;
            font-size: large;

        }
    </style>
</head>

<body>
    <div
        style="width: 100vw;justify-content: center;align-items: center;height:auto;display: flex; flex-direction: column;">
        
        <div style="display: flex;flex-direction: row;">
            <div style="display:flex;flex-direction: column;"><label for="">Name:</label><br>
                <label for="">malayalam:</label><br>
                <label for="">English:</label><br>
                <label for="">Social:</label><br>
                <label for="">IT:</label><br>
                <label for="">Hindi:</label><br>
                <label for="">chemistry:</label><br>
                <label for="">Physics:</label><br>
                <label for="">biology:</label><br>
                <label for="">geograpy:</label><br>
               
            </div>
            
            <div>
                <input type="text" id="name" required><br>
                <input type="text" id="malayalam" required><br>
                <input type="text" id="english" required><br>
                <input type="text" id="social" required><br>
                <input type="text" id="it" required><br>
                <input type="text" id="hindi" required><br>
                <input type="text" id="phisics" required><br>
                <input type="text" id="chemistry" required><br>
                <input type="text" id="biology" required><br>
                <input type="text" id="geograpy" required><br>
            </div>
            


        </div>
        <div>
            <button onclick="adddata()">submit</button>
        </div>
        

    </div>
    <table border="2" style="border-collapse: collapse;width: 100%;" id="table">
        <tr  >
            <th>Name</th>
            <th>malayalam</th>
            <th>English</th>
            <th>Social</th>
            <th>IT</th>
            <th>Hindi</th>
            <th>Pysics</th>
            <th>chemistry</th>
            <th>Biology</th>
            <th>geograpy</th>
            <th>pass OR fail</th>
        </tr>

    </table>

    <script>
        function adddata() {
            let name = document.getElementById("name").value
            let malayalam = document.getElementById('malayalam').value
            let english = document.getElementById('english').value
            let social = document.getElementById('social').value
            let it = document.getElementById('it').value
            let hindi = document.getElementById('hindi').value
            let chemistry = document.getElementById('chemistry').value
            let physics = document.getElementById('phisics').value
            let biology = document.getElementById('biology').value
            let geograpy = document.getElementById('geograpy').value
            let status = "Fail"
            let cl = 'green'
           
            if (english>=30 && malayalam>=30 && social>=30 && hindi >=30 && chemistry >=30 && physics >= 30 && biology >= 30 && geograpy >= 30){
                status = "Pass"
                cl = 'yellow'
                

            }
            
            document.getElementById('table').innerHTML += `<tr style="background-color: ${cl};">
            <td>${name}</td>
            <td>${malayalam}</td>
            <td>${english}</td>
            <td>${social}</td>
            <td>${it}</td>
            <td>${hindi}</td>
            <td>${chemistry}</td>
            <td>${physics}</td>
            <td>${biology}</td>
            <td>${geograpy}</td>
            <td>${status}</td>
        </tr>`

        }
        
    </script>
</body>

</html>
