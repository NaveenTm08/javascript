<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{
            margin-top: 200px;
            width: 200px;
            height: 200px;
            background-color: red;
            
        }
        .div1-1{
            animation: d1 5s infinite;
        }
        @keyframes d1{
            0%{transform: rotate(0deg);}
            33%{transform: rotate(120deg);}
            66%{transform: rotate(240deg);}
            100%{transform: rotate(360deg);}

        }
    
    </style>
</head>
<body>
    <button id ='button'>startanimation</button>
    <div class="div1" id="d1" ></div>
    <script>
        document.getElementById('button').addEventListener("click",()=>{
            document.getElementById("d1").classList.toggle('div1-1')
        })
    </script>
</body>
</html>
