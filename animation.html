<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .aqua{
        background-color: aqua;
        width: 200px;
        height: 200px;
        border-radius: 100px;
        animation: circle 5s infinite;
    }
    @keyframes circle {
        0%,100%{margin-left: 0px;}
        25%{margin-left: 800px; margin-top: 0px;}
        50%{margin-top: 400px;margin-left: 800px;}
        75%{margin-top: 400px;margin-left: 0px;}
    }
</style>
<body>
    <div class="aqua">
        <div class="a1">1</div>
    </div>
</body>
</html>
