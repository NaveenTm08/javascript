    function ans(){
        let a1 = document.getElementById("result1").value
        let c = 1;
        document.getElementById("cot").innerHTML = `<tr>
            <th>${a1}</th>
        </tr>`
        while(c<=10){
            document.getElementById("cot").innerHTML+=`<td>${c} x ${a1} = ${c*a1}</td>`
            c++
        }
        
    }
    function countnum(){
        document.getElementById("answer").innerHTML = ""
        let x = document.getElementById('do').value
        do{
            document.getElementById("answer").innerHTML += x
            x++
        }
        while(x<=10)
