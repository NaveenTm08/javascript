<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>operators</h1>
    <input type="text" id="num1" placeholder="number 1">
    <input type="text" id="num2" placeholder="number 2"><br>
    <button onclick="add()">add</button>
    <button onclick="sub()">sub</button>
    <button onclick="multi()">multi</button>
    <button onclick="div()">div</button>
    <button onclick="mod()">mod</button>

    <p id="result"></p>


    <script>
        // arithametic operators
        let a = 10
        let b = 20
        console.log(a+b)
        console.log(a-b)
        console.log(a*b)
        console.log(b/5)
        console.log(a%3)
        console.log(a**2)
        // incriment 
        a++
        console.log(a)
        // decrment
        b--
        console.log(b)

        

        function add(){
            num1=document.getElementById('num1').value
            num2=document.getElementById('num2').value
            num1 = parseInt(num1)
            num2 = parseInt(num2)
            document.getElementById('result').innerHTML = num1 + num2    
        }
        function sub(){
            num1=parseInt(document.getElementById('num1').value)
            num2=parseInt(document.getElementById('num2').value)
            document.getElementById("result").innerHTML = num1-num2
        }
        function multi(){
            num1=parseInt(document.getElementById("num1").value)
            num2=parseInt(document.getElementById("num2").value)
            document.getElementById("result").innerHTML = num1 * num2
        }
        function div(){
            num1=parseInt(document.getElementById("num1").value)
            num2=parseInt(document.getElementById("num2").value)
            document.getElementById("result").innerHTML = num1/num2
        }
        function mod(){
           num1=parseInt(document.getElementById("num1").value)
            num2=parseInt(document.getElementById("num2").value)
            document.getElementById("result").innerHTML = num1%num2 
        }

    </script>
</body>
</html>
