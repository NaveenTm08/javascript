</head>
<body>

    <p id="a1"></p>

    <p id="a2"></p>

    <button onclick="kl()">click</button>

           console.log(name,age)
           document.getElementById("a2").innerHTML = name
           document.getElementById("a3").innerHTML = age
        }
        
    </script>
