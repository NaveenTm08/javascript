<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .navsection{
        display: flex;
        gap: 10px
    }
    .innernav{
        position: absolute;
        margin: 20px 0px 0px 10px ;
        background-color: yellow;
        overflow: hidden;
        width: 100%;
        display: block;
        height: 0px;
        transition: height 1s;
    }
    
</style>

<body>
    <div class="navsection">
        <div class="nav-item">porjects</div>
        <div class="innernav">
            <ol>
                <li>item1</li>
                <li>item2</li>
                <li>item3</li>
                <li>item4</li>
            </ol>
        </div>
        <div class="nav-item">about</div>
        <div class="innernav">
            <ol>
                <li>about1</li>
                <li>about2</li>
                <li>item3</li>
                <li>item4</li>
            </ol>
        </div>
        
        <div class="nav-item">details</div>
        <div class="innernav">
            <ol>
                <li>details1</li>
                <li>details 2</li>
                <li>details 3</li>
                <li>item4</li>
            </ol>
        </div>
        <div class="nav-item">contact</div>
    </div>
    <script>
        let navitem = document.getElementsByClassName('nav-item')
        let projects = document.getElementsByClassName('innernav')
        
       navitem[0].addEventListener('mouseover',()=>{
        projects[0].style = 'height:300px;'
       })
       navitem[0].addEventListener('mouseleave',()=>{
        projects[0].style = 'height:0px;'
       })
       projects[0].addEventListener('mouseover',()=>{
        projects[0].style = 'height:300px;'
       })
       projects[0].addEventListener('mouseleave',()=>{
        projects[0].style = 'height:0px;'
       })
       navitem[1].addEventListener("mouseover",()=>{
        projects[1].style = 'height:300px;'
       })
       navitem[1].addEventListener('mouseleave',()=>{
        projects[1].style = 'height:0px;'
       })
       projects[1].addEventListener("mouseover",()=>{
        projects[1].style='height:300px;'
       })
       projects[1].addEventListener("mouseleave",()=>{
        projects[1].style='height:0px;'
       })

       navitem[2].addEventListener("mouseover",()=>{
        projects[2].style = 'height:300px;'
       })
       navitem[2].addEventListener('mouseleave',()=>{
        projects[2].style = 'height:0px;'
       })
       projects[2].addEventListener("mouseover",()=>{
        projects[2].style='height:300px;'
       })
       projects[2].addEventListener("mouseleave",()=>{
        projects[2].style='height:0px;'
       })


        
    </script>
</body>

</html>
